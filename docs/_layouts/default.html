<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="EEG去噪、基础模型、智能体、投稿期刊与数据集调研">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <script src="{{ '/app.js' | relative_url }}" defer></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#main-content">跳到正文</a>
    <header class="site-header">
      <div class="header-inner site-width">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
          <svg class="brand-mark" width="34" height="22" viewBox="0 0 34 22" aria-hidden="true">
            <path d="M1 12h6l3-5 4 10 5-15 4 18 4-8h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>EEG Review</span>
        </a>
        <nav class="header-nav" aria-label="主导航">
          <a href="#一研究论文整理-research-papers">研究论文</a>
          <a href="#二可投稿期刊整理-publication-venues">投稿期刊</a>
          <a href="#三数据集整理-datasets">数据集</a>
          <a class="external-link" href="https://github.com/hanyilinn/EEG_Denoising_Review">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main class="site-width" id="main-content" tabindex="-1">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">EEG Research Review</h1>
        <p>整理脑电去噪、解码、基础模型与智能体研究，附投稿期刊与常用数据集。</p>
        <div class="search-panel" role="search" aria-label="资源检索" hidden>
          <label for="table-search">全站检索</label>
          <div class="search-field">
            <input id="table-search" type="search" placeholder="输入论文名、方法或数据集…" autocomplete="off" aria-describedby="search-status">
            <button id="clear-search" class="clear-button" type="button" hidden>清除</button>
          </div>
          <p id="search-status" class="search-status" role="status"></p>
        </div>
      </section>

      <div class="doc-layout">
        <aside class="doc-sidebar" hidden>
          <details class="toc" open>
            <summary>章节目录</summary>
          </details>
        </aside>
        <article class="markdown-body" aria-label="EEG 研究资料">
          {{ content }}
        </article>
      </div>
    </main>

    <footer class="site-footer site-width">
      <span>EEG Review · 持续维护</span>
      <a href="#top">返回顶部 ↑</a>
    </footer>
  </body>
</html>
